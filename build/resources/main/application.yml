spring:
  application:
    name: "umc9th"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스 이름
    url: ${DB_URL} # jdbc:mysql://localhost:3306/umc9th
    username: ${DB_USER} # MySQL 사용자 이름: woongpyo
    password: ${DB_PW} # MySQL 비밀번호: qwer1234

  jpa:
    database: mysql # 사용할 데이터베이스 유형 지정 (MySQL)
    database-platform: org.hibernate.dialect.MySQLDialect # Hibernate가 사용할 MySQL 방언(dialect) 지정
    show-sql: true # 실행되는 SQL 쿼리를 콘솔에 표시할지 여부
    hibernate:
      ddl-auto: update # 엔티티 변경 시 스키마 자동 업데이트
    properties:
      hibernate:
        format_sql: true # 콘솔에 표시되는 SQL을 보기 좋게 포맷팅